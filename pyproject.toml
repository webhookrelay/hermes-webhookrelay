[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-webhookrelay"
dynamic = ["version"]
description = "Durable, secure webhook triggers for Hermes Agent through Webhook Relay"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Webhook Relay", email = "support@webhookrelay.com" }]
keywords = [
  "webhook-relay",
  "hermes-agent",
  "webhooks",
  "event-gateway",
  "webhook-gateway",
  "ai-agent",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.16"]

[project.entry-points."hermes_agent.plugins"]
webhookrelay = "webhookrelay_hermes"

[project.urls]
Homepage = "https://github.com/webhookrelay/hermes-webhookrelay"
Repository = "https://github.com/webhookrelay/hermes-webhookrelay"
Issues = "https://github.com/webhookrelay/hermes-webhookrelay/issues"
"Webhook Relay" = "https://webhookrelay.com"
"Hermes Agent" = "https://github.com/NousResearch/hermes-agent"

[tool.setuptools]
packages = ["webhookrelay_hermes", "webhookrelay_hermes.skills"]
include-package-data = true

[tool.setuptools.package-data]
webhookrelay_hermes = ["plugin.yaml", "skills/**/*"]


[tool.setuptools_scm]
version_file = "webhookrelay_hermes/_version.py"
fallback_version = "0.1.0.dev0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF"]
