<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Durable webhook delivery architecture for Hermes Agent</title>
  <desc id="description">Webhook providers send events to Webhook Relay. An outbound-only stream crosses the firewall into the hermes-webhookrelay adapter, which verifies, deduplicates, and controls concurrency before starting a Hermes Agent run. Failed runs return to Webhook Relay for retry.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <style>
      .label { font: 600 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .title { font: 700 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 500 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#070b14"/>
  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="48" y="52" fill="#f8fafc" class="title">One webhook. One agent run. A reliable outcome.</text>
  <text x="48" y="80" fill="#94a3b8" class="body">Public ingress and durable delivery for a Hermes gateway that stays private.</text>

  <rect x="670" y="26" width="482" height="66" rx="14" fill="#0a1220" stroke="#26364c"/>
  <path d="M 702 52 v-7 a10 10 0 0 1 20 0 v7 M 698 52 h28 v22 h-28 z" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="744" y="51" fill="#7dd3fc" class="label">YOUR PRIVATE NETWORK</text>
  <text x="744" y="73" fill="#94a3b8" class="small">No inbound ports · no public IP · no tunnel exposed</text>

  <line x1="640" y1="108" x2="640" y2="514" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/>
  <rect x="574" y="109" width="132" height="26" rx="13" fill="#111827" stroke="#334155"/>
  <text x="640" y="127" text-anchor="middle" fill="#94a3b8" class="label">FIREWALL / NAT</text>

  <!-- Providers -->
  <g filter="url(#shadow)">
    <rect x="48" y="170" width="210" height="202" rx="18" fill="#0e1626" stroke="#26364c" stroke-width="1.5"/>
  </g>
  <text x="72" y="203" fill="#94a3b8" class="label">WEBHOOK PROVIDERS</text>

  <rect x="72" y="222" width="162" height="38" rx="10" fill="#111c2e" stroke="#2a3a50"/>
  <circle cx="92" cy="241" r="8" fill="none" stroke="#e2e8f0" stroke-width="1.8"/>
  <path d="M 88 247 c-1-3-3-4-3-7 a7 7 0 0 1 14 0 c0 3-2 4-3 7 M 88 234 l2 3 M 96 234 l-2 3" fill="none" stroke="#e2e8f0" stroke-width="1.4" stroke-linecap="round"/>
  <text x="112" y="246" fill="#e2e8f0" class="body">GitHub</text>

  <rect x="72" y="272" width="162" height="38" rx="10" fill="#111c2e" stroke="#2a3a50"/>
  <rect x="84" y="282" width="17" height="17" rx="5" fill="#635bff"/>
  <path d="M 89 294 c1 2 7 2 7-1 c0-3-7-1-7-4 c0-3 6-3 7-1" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <text x="112" y="296" fill="#e2e8f0" class="body">Stripe</text>

  <rect x="72" y="322" width="162" height="26" rx="13" fill="#0b1322" stroke="#26364c"/>
  <circle cx="91" cy="335" r="4" fill="#64748b"/>
  <text x="104" y="340" fill="#94a3b8" class="small">Any HTTP provider</text>

  <!-- Public HTTPS -->
  <path d="M 258 271 H 316" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="287" y="250" text-anchor="middle" fill="#7dd3fc" class="label">PUBLIC</text>
  <text x="287" y="294" text-anchor="middle" fill="#64748b" class="mono">HTTPS</text>

  <!-- Webhook Relay -->
  <g filter="url(#shadow)">
    <rect x="318" y="170" width="250" height="202" rx="18" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <circle cx="354" cy="210" r="18" fill="#082f49" stroke="#38bdf8"/>
  <path d="M 345 209 h8 l-4-4 M 363 211 h-8 l4 4" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="384" y="207" fill="#f8fafc" class="title">Webhook Relay</text>
  <text x="384" y="229" fill="#7dd3fc" class="small">managed public ingress</text>

  <line x1="344" y1="256" x2="542" y2="256" stroke="#26364c"/>
  <text x="344" y="284" fill="#cbd5e1" class="body">Durable event queue</text>
  <g transform="translate(344 300)">
    <rect x="0" y="0" width="96" height="8" rx="4" fill="#164e63"/>
    <rect x="0" y="15" width="146" height="8" rx="4" fill="#0e7490"/>
    <rect x="0" y="30" width="118" height="8" rx="4" fill="#38bdf8"/>
  </g>
  <rect x="482" y="297" width="60" height="29" rx="14" fill="#082f49" stroke="#0e7490"/>
  <circle cx="498" cy="311.5" r="4" fill="#22d3ee"/>
  <text x="510" y="316" fill="#a5f3fc" class="small">ready</text>
  <text x="344" y="352" fill="#94a3b8" class="small">Queues events while Hermes is offline</text>

  <!-- Outbound-only transport -->
  <path d="M 568 271 H 708" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M 704 239 H 574" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
  <text x="638" y="223" text-anchor="middle" fill="#94a3b8" class="small">initiated outbound</text>
  <rect x="578" y="286" width="124" height="29" rx="14" fill="#082f49" stroke="#0e7490"/>
  <path d="M 596 299 v-3 a5 5 0 0 1 10 0 v3 M 594 299 h14 v10 h-14 z" fill="none" stroke="#7dd3fc" stroke-width="1.4"/>
  <text x="616" y="305" fill="#a5f3fc" class="small">outbound only</text>

  <!-- Adapter -->
  <g filter="url(#shadow)">
    <rect x="710" y="170" width="218" height="202" rx="18" fill="#0e1626" stroke="#2a3a50" stroke-width="1.5"/>
  </g>
  <rect x="734" y="194" width="42" height="42" rx="11" fill="#10283a" stroke="#38bdf8"/>
  <path d="M 745 207 h20 M 745 215 h20 M 745 223 h12" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <text x="792" y="205" fill="#f8fafc" class="body">Webhook Relay</text>
  <text x="792" y="226" fill="#f8fafc" class="body">adapter</text>
  <line x1="734" y1="256" x2="904" y2="256" stroke="#26364c"/>
  <g>
    <circle cx="744" cy="282" r="5" fill="#22c55e"/>
    <text x="758" y="287" fill="#cbd5e1" class="small">Verify signature</text>
    <circle cx="744" cy="310" r="5" fill="#22c55e"/>
    <text x="758" y="315" fill="#cbd5e1" class="small">Deduplicate</text>
    <circle cx="744" cy="338" r="5" fill="#22c55e"/>
    <text x="758" y="343" fill="#cbd5e1" class="small">Limit concurrency</text>
  </g>

  <path d="M 928 271 H 970" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-amber)"/>

  <!-- Hermes -->
  <g filter="url(#shadow)">
    <rect x="972" y="170" width="180" height="202" rx="18" fill="#1d1720" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <circle cx="1008" cy="212" r="18" fill="#422006" stroke="#fbbf24"/>
  <path d="M 999 216 c6-1 7-7 9-13 c2 6 3 12 9 13 c-5 1-7 4-9 9 c-2-5-4-8-9-9 z" fill="#fde68a"/>
  <text x="1038" y="207" fill="#f8fafc" class="title">Hermes</text>
  <text x="1038" y="230" fill="#fde68a" class="small">Agent run</text>
  <line x1="996" y1="256" x2="1128" y2="256" stroke="#49351d"/>
  <text x="996" y="286" fill="#cbd5e1" class="small">Run tools</text>
  <text x="996" y="310" fill="#cbd5e1" class="small">Create side effects</text>
  <text x="996" y="334" fill="#cbd5e1" class="small">Return real outcome</text>

  <!-- Outcome and retry semantics -->
  <path d="M 1062 372 V 414" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="961" y="414" width="90" height="34" rx="17" fill="#052e25" stroke="#22c55e"/>
  <circle cx="980" cy="431" r="5" fill="#22c55e"/>
  <text x="992" y="436" fill="#bbf7d0" class="mono">2xx done</text>
  <rect x="1061" y="414" width="91" height="34" rx="17" fill="#3b1d12" stroke="#f97316"/>
  <circle cx="1080" cy="431" r="5" fill="#fb923c"/>
  <text x="1092" y="436" fill="#fed7aa" class="mono">5xx retry</text>

  <path d="M 1106 449 V 487 H 443 V 376" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow-amber)"/>
  <rect x="649" y="471" width="250" height="32" rx="16" fill="#21170f" stroke="#7c2d12"/>
  <path d="M 670 482 a7 7 0 1 1-1 8 M 670 482 v6 h-6" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="686" y="492" fill="#fed7aa" class="small">failed runs return to the durable queue</text>

  <rect x="48" y="414" width="486" height="89" rx="16" fill="#0a1220" stroke="#26364c"/>
  <text x="72" y="443" fill="#7dd3fc" class="label">DELIVERY CONTRACT</text>
  <text x="72" y="471" fill="#e2e8f0" class="body">The HTTP response reflects the agent run—not just receipt.</text>
  <text x="72" y="491" fill="#94a3b8" class="small">No early 202, no silent loss, no accidental double run.</text>
</svg>
