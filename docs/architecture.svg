<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Webhook Relay architecture for Hermes Agent</title>
  <desc id="description">Webhook providers send events to Webhook Relay. An outbound-only stream crosses the firewall into the Hermes adapter, which verifies and deduplicates events before an agent run. Failed runs return to the durable queue for retry.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="muted-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#fb923c"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <style>
      .eyebrow { font: 700 12px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .1em; }
      .heading { font: 700 21px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 500 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font: 650 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="24" fill="#070b14"/>
  <rect x="1" y="1" width="1198" height="428" rx="23" fill="none" stroke="#1e293b" stroke-width="2"/>

  <text x="48" y="42" fill="#64748b" class="eyebrow">PUBLIC INTERNET</text>
  <rect x="658" y="18" width="494" height="58" rx="14" fill="#0a1220" stroke="#26364c"/>
  <path d="M686 43v-6a9 9 0 0 1 18 0v6m-21 0h24v20h-24z" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="724" y="42" fill="#7dd3fc" class="eyebrow">YOUR PRIVATE NETWORK</text>
  <text x="724" y="62" fill="#94a3b8" class="small">No inbound ports or public IP</text>

  <line x1="625" y1="22" x2="625" y2="392" stroke="#334155" stroke-width="2" stroke-dasharray="7 8"/>
  <rect x="566" y="87" width="118" height="26" rx="13" fill="#111827" stroke="#334155"/>
  <text x="625" y="105" text-anchor="middle" fill="#94a3b8" class="eyebrow">FIREWALL / NAT</text>

  <!-- Providers -->
  <g filter="url(#shadow)">
    <rect x="48" y="128" width="188" height="190" rx="18" fill="#0e1626" stroke="#26364c" stroke-width="1.5"/>
  </g>
  <text x="70" y="158" fill="#94a3b8" class="eyebrow">PROVIDERS</text>
  <rect x="70" y="178" width="144" height="36" rx="10" fill="#111c2e" stroke="#2a3a50"/>
  <circle cx="90" cy="196" r="8" fill="none" stroke="#e2e8f0" stroke-width="1.7"/>
  <path d="M86 202c-1-3-3-4-3-7a7 7 0 0 1 14 0c0 3-2 4-3 7m-8-13 2 3m6-3-2 3" fill="none" stroke="#e2e8f0" stroke-width="1.3" stroke-linecap="round"/>
  <text x="109" y="201" fill="#e2e8f0" class="body">GitHub</text>
  <rect x="70" y="225" width="144" height="36" rx="10" fill="#111c2e" stroke="#2a3a50"/>
  <rect x="82" y="235" width="17" height="17" rx="5" fill="#635bff"/>
  <path d="M87 247c1 2 7 2 7-1 0-3-7-1-7-4 0-3 6-3 7-1" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
  <text x="109" y="248" fill="#e2e8f0" class="body">Stripe</text>
  <rect x="70" y="272" width="144" height="26" rx="13" fill="#0b1322" stroke="#26364c"/>
  <circle cx="89" cy="285" r="4" fill="#64748b"/>
  <text x="102" y="290" fill="#94a3b8" class="small">Any provider</text>

  <!-- Public delivery -->
  <path d="M236 220h62" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="267" y="198" text-anchor="middle" fill="#7dd3fc" class="eyebrow">HTTPS</text>

  <!-- Webhook Relay -->
  <g filter="url(#shadow)">
    <rect x="300" y="128" width="250" height="190" rx="18" fill="#0d1b2a" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
  <circle cx="336" cy="168" r="18" fill="#082f49" stroke="#38bdf8"/>
  <path d="M327 167h8l-4-4m18 6h-8l4 4" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="165" fill="#f8fafc" class="heading">Webhook Relay</text>
  <text x="366" y="187" fill="#7dd3fc" class="small">public ingress</text>
  <line x1="326" y1="208" x2="524" y2="208" stroke="#26364c"/>
  <text x="326" y="235" fill="#cbd5e1" class="body">Durable queue</text>
  <g transform="translate(326 250)">
    <rect width="91" height="8" rx="4" fill="#164e63"/>
    <rect y="15" width="142" height="8" rx="4" fill="#0e7490"/>
    <rect y="30" width="116" height="8" rx="4" fill="#38bdf8"/>
  </g>
  <rect x="466" y="247" width="58" height="29" rx="14" fill="#082f49" stroke="#0e7490"/>
  <circle cx="482" cy="261.5" r="4" fill="#22d3ee"/>
  <text x="494" y="266" fill="#a5f3fc" class="small">ready</text>
  <text x="326" y="302" fill="#94a3b8" class="small">Queued while Hermes is offline</text>

  <!-- Outbound-only connection -->
  <path d="M550 220h138" fill="none" stroke="#38bdf8" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <path d="M684 187H556" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#muted-arrow)"/>
  <text x="620" y="174" text-anchor="middle" fill="#94a3b8" class="small">opens outbound</text>
  <rect x="562" y="236" width="126" height="29" rx="14" fill="#082f49" stroke="#0e7490"/>
  <path d="M579 249v-3a5 5 0 0 1 10 0v3m-12 0h14v10h-14z" fill="none" stroke="#7dd3fc" stroke-width="1.4"/>
  <text x="599" y="255" fill="#a5f3fc" class="small">outbound only</text>

  <!-- Adapter -->
  <g filter="url(#shadow)">
    <rect x="690" y="128" width="224" height="190" rx="18" fill="#0e1626" stroke="#2a3a50" stroke-width="1.5"/>
  </g>
  <rect x="714" y="151" width="42" height="42" rx="11" fill="#10283a" stroke="#38bdf8"/>
  <path d="M725 164h20m-20 8h20m-20 8h12" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
  <text x="772" y="164" fill="#f8fafc" class="heading">Hermes</text>
  <text x="772" y="186" fill="#7dd3fc" class="small">Webhook Relay adapter</text>
  <line x1="714" y1="208" x2="890" y2="208" stroke="#26364c"/>
  <circle cx="724" cy="235" r="5" fill="#22c55e"/>
  <text x="739" y="240" fill="#cbd5e1" class="body">Verify signature</text>
  <circle cx="724" cy="266" r="5" fill="#22c55e"/>
  <text x="739" y="271" fill="#cbd5e1" class="body">Deduplicate</text>
  <circle cx="724" cy="297" r="5" fill="#22c55e"/>
  <text x="739" y="302" fill="#cbd5e1" class="body">Control concurrency</text>

  <path d="M914 220h54" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#amber-arrow)"/>

  <!-- Hermes Agent -->
  <g filter="url(#shadow)">
    <rect x="970" y="128" width="182" height="190" rx="18" fill="#1d1720" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <circle cx="1006" cy="168" r="18" fill="#422006" stroke="#fbbf24"/>
  <path d="M997 172c6-1 7-7 9-13 2 6 3 12 9 13-5 1-7 4-9 9-2-5-4-8-9-9Z" fill="#fde68a"/>
  <text x="1036" y="165" fill="#f8fafc" class="heading">Hermes</text>
  <text x="1036" y="187" fill="#fde68a" class="small">agent run</text>
  <line x1="994" y1="208" x2="1128" y2="208" stroke="#49351d"/>
  <text x="994" y="239" fill="#cbd5e1" class="body">Run tools</text>
  <text x="994" y="267" fill="#cbd5e1" class="body">Apply side effects</text>
  <text x="994" y="295" fill="#cbd5e1" class="body">Return outcome</text>

  <!-- Run outcome -->
  <path d="M1061 318v25" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <rect x="947" y="343" width="99" height="34" rx="17" fill="#052e25" stroke="#22c55e"/>
  <circle cx="967" cy="360" r="5" fill="#22c55e"/>
  <text x="980" y="365" fill="#bbf7d0" class="mono">2xx done</text>
  <rect x="1055" y="343" width="97" height="34" rx="17" fill="#3b1d12" stroke="#f97316"/>
  <circle cx="1075" cy="360" r="5" fill="#fb923c"/>
  <text x="1088" y="365" fill="#fed7aa" class="mono">5xx retry</text>

  <path d="M1104 377v25H425v-81" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#amber-arrow)"/>
  <rect x="660" y="386" width="244" height="31" rx="15.5" fill="#21170f" stroke="#7c2d12"/>
  <path d="M678 397a7 7 0 1 1-1 8m1-8v6h-6" fill="none" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="694" y="407" fill="#fed7aa" class="small">failed run returns to the queue</text>
</svg>
