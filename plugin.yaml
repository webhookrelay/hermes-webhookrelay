name: webhookrelay
label: Webhook Relay
kind: platform
version: 0.1.0
description: >
  Durable and secure webhook triggers for Hermes Agent through a stable public
  endpoint and an outbound-only connection to a private gateway.
author: Webhook Relay
homepage: https://github.com/webhookrelay/hermes-webhookrelay
license: MIT
tags: [webhooks, gateway, automation, durable-delivery]
provides_tools:
  - webhookrelay_queue_status
  - webhookrelay_list_failed_events
  - webhookrelay_get_event
provides_hooks: []
python_dependencies:
  - "aiohttp>=3.9,<4"
requires_env: []
optional_env:
  - name: RELAY_KEY
    description: Webhook Relay token key from my.webhookrelay.com/tokens
    prompt: Webhook Relay token key
    password: true
  - name: RELAY_SECRET
    description: Webhook Relay token secret
    prompt: Webhook Relay token secret
    password: true
  - name: WEBHOOKRELAY_HERMES_PORT
    description: Local adapter port (default 3580)
    prompt: Adapter port
    password: false
  - name: WEBHOOKRELAY_HERMES_PATH
    description: Local adapter base path (default /webhookrelay)
    prompt: Adapter path
    password: false
